name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Windows: the full GUT suite only (the hygiene and editor checks run in `test`).
  test-windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned Godot
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source tools/pins.env
          bin="$RUNNER_TEMP/godot-bin"
          mkdir -p "$bin"
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_win64.exe.zip"
          7z x -y -o"$bin" "$RUNNER_TEMP/godot.zip" > /dev/null
          # The _console.exe wrapper gives a console process (stdout and exit codes) and starts
          # the main exe next to it, so both keep their names and a small shim is the `godot` command.
          printf '#!/usr/bin/env bash\nexec "%s/Godot_v%s_win64_console.exe" "$@"\n' "$bin" "$GODOT_TAG" > "$bin/godot"
          chmod +x "$bin/godot"
          cygpath -w "$bin" >> "$GITHUB_PATH"

      - name: Check Godot version matches the pin
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source tools/pins.env
          version="$(godot --version | tr -d '\r' | tail -n 1)"
          echo "godot --version: $version"
          expected="${GODOT_TAG%-stable}.stable."
          if [[ "$version" != "$expected"* ]]; then
            echo "::error::Godot reports ${version}, but tools/pins.env pins ${GODOT_TAG}."
            exit 1
          fi
          echo "::notice title=Godot on Windows::${version} (pinned ${GODOT_TAG})"

      - name: Import and test
        run: |
          set -euo pipefail
          tools/run_tests.sh 2>&1 | tee "$RUNNER_TEMP/gut.log"
          # Surface GUT's totals as a notice, so the run page shows what ran on Windows.
          totals="$(tr -d '\r' < "$RUNNER_TEMP/gut.log" | sed 's/\x1b\[[0-9;]*m//g' \
            | grep -E '^(Scripts|Tests|Passing Tests|Asserts) ' | tr -s ' ' | paste -sd ',' -)"
          echo "::notice title=GUT on Windows::${totals}"

  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # addons/wyrd/ is a test-only copy of a Wyrd release; it must match tools/wyrd-pin.env exactly.
      - name: Vendored Wyrd matches its pin
        run: tools/check_wyrd_pin.sh

      - name: Install pinned Godot
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source tools/pins.env
          mkdir -p "$HOME/.local/bin" /tmp/godot-bin
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q -o /tmp/godot.zip -d /tmp/godot-bin
          install -m 0755 "/tmp/godot-bin/Godot_v${GODOT_TAG}_linux.x86_64" "$HOME/.local/bin/godot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/godot" --version

      - name: Import and test
        run: |
          set -euo pipefail
          tools/run_tests.sh 2>&1 | tee "$RUNNER_TEMP/gut.log"
          # Surface GUT's totals as a notice, so the run page shows what ran on Ubuntu.
          totals="$(tr -d '\r' < "$RUNNER_TEMP/gut.log" | sed 's/\x1b\[[0-9;]*m//g' \
            | grep -E '^(Scripts|Tests|Passing Tests|Asserts) ' | tr -s ' ' | paste -sd ',' -)"
          echo "::notice title=GUT on Ubuntu::${totals}"

      # Opens the project in the editor (headless) with the Strongbox and GUT plugins
      # enabled. Fails on a non-zero exit, on any ERROR / SCRIPT ERROR line, or if
      # project.godot is not in Godot's own format (the GUI editor would rewrite it).
      - name: Editor loads plugins without errors
        run: |
          set -euo pipefail
          for cfg in res://addons/strongbox/plugin.cfg res://addons/gut/plugin.cfg; do
            if ! grep -q -F "\"$cfg\"" project.godot; then
              echo "::error::$cfg is not enabled under [editor_plugins] in project.godot."
              exit 1
            fi
          done

          log="$(mktemp)"
          resave="$(mktemp --suffix=.gd)"
          trap 'rm -f "$log" "$resave"' EXIT
          set +e
          godot --headless --editor --path . --quit-after 120 >"$log" 2>&1
          code=$?
          set -e
          cat "$log"

          if [[ "$code" -ne 0 ]]; then
            echo "::error::The editor exited with code ${code}."
            exit 1
          fi
          # Known noise, ignored on purpose: GUT's editor plugin checks online for a newer
          # GUT once a day and logs this one ERROR when the request fails or times out.
          if grep -v -F '[GUT] Could not get version info' "$log" | grep -q -E 'ERROR'; then
            echo "::error::The editor logged an ERROR while loading the project. See the log above."
            exit 1
          fi
          # The headless editor never saves project.godot, so ask Godot to re-save it in
          # its own format and fail if that changes the committed file.
          printf '%s\n' 'extends SceneTree' 'func _init() -> void:' \
            '	var err: Error = ProjectSettings.save()' '	quit(0 if err == OK else 1)' > "$resave"
          godot --headless --path . -s "$resave" >/dev/null 2>&1
          if ! git diff --quiet -- project.godot; then
            git diff -- project.godot
            echo "::error::project.godot is not in Godot's own format, so the editor would rewrite it. Commit the formatting shown above."
            exit 1
          fi
          echo "Editor loaded the project and plugins with no errors."

      # Fails if any term from the STRONGBOX_HYGIENE_TERMS secret (one per line,
      # case-insensitive, fixed string) appears in a line this change adds.
      # It never prints the terms or the matching lines. Vendored GUT is excluded.
      - name: Content hygiene
        if: always()
        env:
          HYGIENE_TERMS: ${{ secrets.STRONGBOX_HYGIENE_TERMS }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "${HYGIENE_TERMS:-}" ]]; then
            echo "::warning::STRONGBOX_HYGIENE_TERMS is unset; skipping the content-hygiene check."
            exit 0
          fi

          if [[ -n "${BASE_REF:-}" ]]; then
            range="origin/${BASE_REF}...HEAD"
          elif [[ -n "${PUSH_BEFORE:-}" && ! "${PUSH_BEFORE}" =~ ^0+$ ]]; then
            range="${PUSH_BEFORE}..HEAD"
          else
            echo "::warning::No base revision to diff against; skipping the content-hygiene check."
            exit 0
          fi

          umask 077
          terms_file="$(mktemp)"
          added_file="$(mktemp)"
          trap 'rm -f "$terms_file" "$added_file"' EXIT

          # Trim whitespace and drop empty lines. Never echo the terms.
          while IFS= read -r line || [[ -n "$line" ]]; do
            trimmed="${line#"${line%%[![:space:]]*}"}"
            trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
            if [[ -n "$trimmed" ]]; then
              printf '%s\n' "$trimmed" >> "$terms_file"
            fi
          done <<< "$HYGIENE_TERMS"

          if [[ ! -s "$terms_file" ]]; then
            echo "::warning::STRONGBOX_HYGIENE_TERMS is empty; skipping the content-hygiene check."
            exit 0
          fi

          # Added lines and new file paths only, so removing a term never fails the check.
          git diff --no-color --unified=0 "$range" -- . ':(exclude)addons/gut' \
            | grep -E '^\+' > "$added_file" || true

          if grep -F -i -q -f "$terms_file" "$added_file"; then
            echo "::error::Content hygiene failed: the diff adds a term from the deny-list."
            exit 1
          fi
          echo "Content hygiene passed."
